# Builds the (iss, sub) identity-linking patch into a Grafana image for the
# manergi lab, natively on both architectures, and publishes one multi-arch tag.
# Lives on its own branch with every upstream workflow removed, so pushing it
# runs this and nothing else. The patch itself is on
# auth/link-identities-by-issuer-and-subject; this branch only adds the build.
name: isssub image

on:
  push:
    branches: [ci/isssub-image]
  workflow_dispatch:

env:
  IMAGE: registry.gitlab.com/manergi/infra/grafana-isssub

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      # A full Grafana build (node_modules, webpack, Go cache, image layers)
      # outgrows the runner's ~14 GB free disk; drop toolchains it never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      # The tag names the PATCH commit, not this branch's build commit, so it
      # matches the images built before CI (main-1cd44864 etc.).
      - name: Tag
        id: tag
        run: |
          git fetch --depth=2 origin "$GITHUB_SHA"
          echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=8 HEAD~1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}

      # Grafana's own Dockerfile, unmodified. JS_PLATFORM defaults to amd64,
      # which would run the frontend build emulated on the arm runner.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            JS_PLATFORM=linux/${{ matrix.arch }}
            COMMIT_SHA=${{ steps.tag.outputs.sha }}
            BUILD_BRANCH=auth/link-identities-by-issuer-and-subject
          tags: ${{ env.IMAGE }}:main-${{ steps.tag.outputs.short }}-${{ matrix.arch }}
          push: true
          provenance: false

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: tag
        run: echo "short=$(git rev-parse --short=8 HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      - name: Publish the multi-arch tag
        run: |
          T="$IMAGE:main-${{ steps.tag.outputs.short }}"
          docker buildx imagetools create -t "$T" "$T-amd64" "$T-arm64"
          docker buildx imagetools inspect "$T"
